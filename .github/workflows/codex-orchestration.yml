name: Codex Orchestration Controls

on:
  workflow_dispatch:
  pull_request:
    branches: [stattracker]
    paths:
      - '.github/codex/orchestration/**'
      - '.github/workflows/codex-orchestration.yml'
      - '.codex/agents/stattracker-*.toml'

permissions:
  contents: read

concurrency:
  group: orchestration-controls-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  orchestration-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline state-machine and fault tests (no model or remote writes)
        run: node --test .github/codex/orchestration/orchestration.test.mjs
